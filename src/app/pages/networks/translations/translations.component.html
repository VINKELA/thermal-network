<nb-card>
  <nb-card-header class="d-flex justify-content-between align-items-center">
    <h3>Route Tracing</h3>
    
    <div class="header-actions">
      <button nbButton size="small" status="info" (click)="goToComparison()">
        <nb-icon icon="bar-chart-2-outline"></nb-icon> Compare Routes
      </button>
    </div>
  </nb-card-header>
  <nb-card-body>
    <nb-alert status="info" *ngIf="activeOperations.length" class="task-alert">
      <strong>Background route tracing</strong>
      <div *ngFor="let operation of activeOperations" class="task-row">
        <span>{{ operation.label }}</span>
        <small>{{ operation.status }} · {{ operation.message || 'Running in Celery' }}</small>
        <small>Task {{ operation.taskId }}</small>
      </div>
    </nb-alert>

    <ng2-smart-table [settings]="settings" [source]="source" (deleteConfirm)="onDeleteConfirm($event)" (editConfirm)="onEditConfirm($event)" (createConfirm)="onCreateConfirm($event)">
    </ng2-smart-table>
  </nb-card-body>
</nb-card>
