<nb-card class="auth-card" [nbSpinner]="loading" nbSpinnerStatus="primary">
  <nb-card-header>
    <h1>Set new password</h1>
    <p>Choose a new password for this account.</p>
  </nb-card-header>
  <nb-card-body>
    <nb-alert *ngIf="message" status="success">{{ message }}</nb-alert>
    <nb-alert *ngIf="error" status="danger">{{ error }}</nb-alert>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>New password</span>
        <input nbInput fullWidth type="password" formControlName="new_password" autocomplete="new-password">
      </label>
      <button nbButton status="primary" fullWidth type="button" (click)="submit()" [disabled]="form.invalid || loading || !uid || !token">Save password</button>
    </form>
  </nb-card-body>
  <nb-card-footer>
    <a routerLink="/auth/request-password">Request a new link</a>
  </nb-card-footer>
</nb-card>
