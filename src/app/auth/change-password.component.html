<nb-card class="auth-card" [nbSpinner]="loading" nbSpinnerStatus="primary">
  <nb-card-header>
    <h1>Change password</h1>
    <p>Your current session will close after the password is changed.</p>
  </nb-card-header>
  <nb-card-body>
    <nb-alert *ngIf="error" status="danger">{{ error }}</nb-alert>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Current password</span>
        <input nbInput fullWidth type="password" formControlName="old_password" autocomplete="current-password">
      </label>
      <label>
        <span>New password</span>
        <input nbInput fullWidth type="password" formControlName="new_password" autocomplete="new-password">
      </label>
      <button nbButton status="primary" fullWidth type="button" (click)="submit()" [disabled]="form.invalid || loading">Change password</button>
    </form>
  </nb-card-body>
  <nb-card-footer>
    <a routerLink="/pages">Back to workspace</a>
  </nb-card-footer>
</nb-card>
