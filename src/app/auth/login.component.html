<nb-card class="auth-card" [nbSpinner]="loading" nbSpinnerStatus="primary">
  <nb-card-header>
    <h1>Sign in</h1>
    <p>Use your District Heat Network account to open your project workspace.</p>
  </nb-card-header>
  <nb-card-body>
    <nb-alert *ngIf="error" status="danger">{{ error }}</nb-alert>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Email or username</span>
        <input nbInput fullWidth formControlName="username" autocomplete="username">
      </label>
      <label>
        <span>Password</span>
        <input nbInput fullWidth type="password" formControlName="password" autocomplete="current-password">
      </label>
      <button nbButton status="primary" fullWidth type="submit" [disabled]="form.invalid || loading">Sign in</button>
    </form>
  </nb-card-body>
  <nb-card-footer>
    <a routerLink="/auth/request-password">Forgot password?</a>
    <a routerLink="/auth/register">Create account</a>
  </nb-card-footer>
</nb-card>
