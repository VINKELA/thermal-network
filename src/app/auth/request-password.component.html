<nb-card class="auth-card" [nbSpinner]="loading" nbSpinnerStatus="primary">
  <nb-card-header>
    <h1>Reset password</h1>
    <p>Enter your email and use the link printed by the development server.</p>
  </nb-card-header>
  <nb-card-body>
    <nb-alert *ngIf="message" status="success">{{ message }}</nb-alert>
    <nb-alert *ngIf="error" status="danger">{{ error }}</nb-alert>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Email</span>
        <input nbInput fullWidth formControlName="email" autocomplete="email">
      </label>
      <button nbButton status="primary" fullWidth type="button" (click)="submit()" [disabled]="form.invalid || loading">Send reset link</button>
    </form>
  </nb-card-body>
  <nb-card-footer>
    <a routerLink="/auth/login">Back to sign in</a>
  </nb-card-footer>
</nb-card>
